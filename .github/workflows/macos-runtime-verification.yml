name: macOS runtime verification

on:
  pull_request:
    branches: [avalonia]
    paths:
      - '.github/workflows/macos-runtime-verification.yml'
      - 'scripts/performance/macos-desktop-smoke.mjs'

permissions:
  contents: read

jobs:
  macos-runtime:
    name: Bundled macOS runtime
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Publish the desktop app
        run: dotnet publish src/Egroo.Avalonia/Desktop -c Release -r osx-arm64 --self-contained -o artifacts/desktop/
      - name: Launch the app and exercise WKWebView
        run: node scripts/performance/macos-desktop-smoke.mjs artifacts/Egroo.app src/Egroo.UI/wwwroot "$RUNNER_TEMP/egroo-macos-smoke.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: macos-runtime-evidence
          path: ${{ runner.temp }}/egroo-macos-smoke.json
          if-no-files-found: ignore
