name: Avalonia containers

on:
  pull_request:
    branches: [avalonia, main]
    paths:
      - '.github/workflows/avalonia-containers.yml'
      - '.dockerignore'
      - 'global.json'
      - 'Directory.Build.props'
      - 'scripts/smoke-avalonia-containers.sh'
      - 'scripts/verify-published-image.sh'
      - 'scripts/performance/browser-ready.mjs'
      - 'scripts/performance/package*.json'
      - 'src/Egroo.Avalonia/**'
      - 'src/Egroo.Client/**'
      - 'src/Egroo.Contracts/**'
      - 'src/Egroo.Server/**'
      - 'src/Egroo.Server.SignalR/**'
      - 'src/Egroo.UI/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test API and browser images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build images
        run: |
          revision_label="org.opencontainers.image.revision=$GITHUB_SHA"
          docker build --pull --label "$revision_label" -f src/Egroo.Server/Dockerfile -t egroo-api:verified .
          docker build --pull --label "$revision_label" -f src/Egroo.Avalonia/Browser/Dockerfile -t egroo-browser:verified .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Pull and smoke-test both images from a loopback registry
        run: |
          npm ci --prefix scripts/performance --ignore-scripts

          registry=127.0.0.1:15000
          docker run --detach --name egroo-release-registry --publish "$registry:5000" registry:3
          trap 'docker rm --force --volumes egroo-release-registry >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 5 "http://$registry/v2/" >/dev/null

          api_tag="$registry/egroo-api:fixture"
          browser_tag="$registry/egroo-browser:fixture"
          docker tag egroo-api:verified "$api_tag"
          docker tag egroo-browser:verified "$browser_tag"
          docker push "$api_tag"
          docker push "$browser_tag"
          docker image rm "$api_tag" "$browser_tag" egroo-api:verified egroo-browser:verified

          api=$(bash scripts/verify-published-image.sh "$api_tag" "$GITHUB_SHA")
          browser=$(bash scripts/verify-published-image.sh "$browser_tag" "$GITHUB_SHA")
          bash scripts/smoke-avalonia-containers.sh "$api" "$browser"

  publish:
    name: Publish verified images to GHCR
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.push.outputs.api }}
      browser: ${{ steps.push.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build release images
        run: |
          labels=(
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker build --pull "${labels[@]}" -f src/Egroo.Server/Dockerfile -t egroo-api:verified .
          docker build --pull "${labels[@]}" -f src/Egroo.Avalonia/Browser/Dockerfile -t egroo-browser:verified .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Smoke-test release images
        run: |
          npm ci --prefix scripts/performance --ignore-scripts
          bash scripts/smoke-avalonia-containers.sh egroo-api:verified egroo-browser:verified
      - name: Push both images with the same release tag
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          api="$repo-api:$tag"
          browser="$repo-browser:$tag"
          docker tag egroo-api:verified "$api"
          docker tag egroo-browser:verified "$browser"
          docker push "$api"
          docker push "$browser"
          printf 'api=%s\nbrowser=%s\n' "$api" "$browser" >> "$GITHUB_OUTPUT"

  verify-published:
    name: Pull and smoke-test the published images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --prefix scripts/performance --ignore-scripts
      - name: Verify and report the published digest pair
        env:
          GHCR_TOKEN: ${{ github.token }}
          API_TAG: ${{ needs.publish.outputs.api }}
          BROWSER_TAG: ${{ needs.publish.outputs.browser }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          unset GHCR_TOKEN
          api=$(bash scripts/verify-published-image.sh "$API_TAG" "$GITHUB_SHA")
          browser=$(bash scripts/verify-published-image.sh "$BROWSER_TAG" "$GITHUB_SHA")
          bash scripts/smoke-avalonia-containers.sh "$api" "$browser"
          {
            printf '### Verified Avalonia container images\n\n'
            printf -- '- API `%s` from `%s`\n' "$api" "$API_TAG"
            printf -- '- Browser `%s` from `%s`\n' "$browser" "$BROWSER_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
